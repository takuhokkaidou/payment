<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムふたりの貸し借りメモ</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 16px; background: #f4f6f8; color: #333; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 12px; }
    button:hover { background: #0056b3; }
    .result { font-size: 1.2em; font-weight: bold; color: #28a745; text-align: center; padding: 10px 0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 12px 10px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 4px; }
    .item-header { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; align-items: center; }
    .item-body { font-size: 1em; display: flex; justify-content: space-between; align-items: center; }
    .room-info { background: #e9ecef; padding: 8px; border-radius: 6px; font-size: 0.85em; text-align: center; word-break: break-all; margin-bottom: 12px; }
    .filter-group { margin-bottom: 12px; }
    .flex-inputs { display: flex; gap: 8px; }
    .flex-inputs > div { flex: 1; }
    
    .quick-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .note-btn { width: auto; padding: 6px 12px; font-size: 0.85em; background: #e9ecef; color: #495057; border: 1px solid #ced4da; margin-top: 0; border-radius: 16px; }
    
    .tab-menu { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 16px; background: #fff; border-radius: 8px 8px 0 0; overflow: hidden; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #f1f3f5; color: #495057; font-weight: bold; cursor: pointer; border-radius: 0; margin-top: 0; }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .filter-summary { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9em; }
    .filter-summary div { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .filter-summary div:last-child { margin-bottom: 0; font-weight: bold; border-top: 1px dashed #74c0fc; padding-top: 4px; }

    .btn-delete { width: auto; padding: 4px 8px; font-size: 0.8em; background: #dc3545; color: white; border: none; border-radius: 4px; margin-top: 0; }
    .btn-delete:hover { background: #bd2130; }
    .pending-badge { font-size: 0.8em; color: #e67e22; background: #fef5e7; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .settled-badge { font-size: 0.8em; color: #28a745; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
    
    .approval-card { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .approval-card h4 { margin: 0 0 8px 0; color: #856404; font-size: 0.95em; }
    .approval-item { font-size: 0.85em; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #ffe8a1; }
    .approval-btns { display: flex; gap: 8px; }
    .approval-btns button { padding: 6px; font-size: 0.8em; margin-top: 4px; }
    .btn-approve { background: #28a745; }
    .btn-reject { background: #6c757d; }

    .checkbox-label { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: normal; font-size: 0.85em; cursor: pointer; }
    .checkbox-label input { width: auto; margin-top: 0; }
    .my-role-select { background: #e2e3e5; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85em; }

    .btn-settle { background: #28a745; color: white; margin-top: 16px; padding: 10px; font-size: 0.95em; border-radius: 8px; display: none; }
    .btn-settle:hover { background: #218838; }

    /* AI解析用スタイル */
    .ai-box { background: #eef2ff; border: 1px dashed #6366f1; padding: 12px; border-radius: 8px; margin-top: 20px; }
    .ai-box label { color: #4338ca; margin-top: 0; }
    .ai-btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .ai-btn-group button { font-size: 0.85em; padding: 8px; margin-top: 0; background: #6366f1; }
    .ai-btn-group button:hover { background: #4f46e5; }
    .loading-status { font-size: 0.85em; color: #6366f1; font-weight: bold; display: none; margin-top: 8px; text-align: center; }

    /* リアルタイムカメラ表示 */
    #camera-preview-container { display: none; margin-top: 10px; text-align: center; }
    #camera-video { width: 100%; border-radius: 8px; background: #000; max-height: 300px; object-fit: cover; }
    .cam-action-btns { display: flex; gap: 8px; margin-top: 6px; }
    .cam-action-btns button { margin-top: 0; font-size: 0.85em; padding: 8px; }

    /* バージョン情報表示スタイル */
    .version-info { text-align: center; font-size: 0.8em; color: #6c757d; margin-top: 16px; padding-top: 8px; border-top: 1px dashed #ced4da; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmI46_HJP4T8gAx4upeCcF2eDNTXX-G6Q",
      authDomain: "payment-30c94.firebaseapp.com",
      databaseURL: "https://payment-30c94-default-rtdb.firebaseio.com",
      projectId: "payment-30c94",
      storageBucket: "payment-30c94.firebasestorage.app",
      messagingSenderId: "577725674845",
      appId: "1:577725674845:web:683b4d28b97ff3817aa4b4",
      measurementId: "G-H98HFNV6TX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 8);
      window.history.replaceState(null, null, `?room=${roomId}`);
    }

    document.getElementById('room-id').innerText = roomId;
    document.getElementById('share-url').value = window.location.href;

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;

    let rawDataCache = {};
    let currentSettings = { nameA: "Aさん", nameB: "Bさん", currentEvent: "all", geminiApiKey: "" };
    let eventsList = { "default": "日常の貸し借り" };
    let currentUserRole = localStorage.getItem(`room_${roomId}_role`) || 'A';
    let currentSettlementData = null;
    let cameraStream = null;

    onValue(ref(db, `rooms/${roomId}/settings`), (snapshot) => {
      const data = snapshot.val();
      if (data) currentSettings = { ...currentSettings, ...data };
      updateNamesUI();
      if (currentSettings.geminiApiKey) {
        document.getElementById('gemini-key-input').value = currentSettings.geminiApiKey;
      }
    });

    onValue(ref(db, `rooms/${roomId}/events`), (snapshot) => {
      const data = snapshot.val();
      if (data) eventsList = data;
      updateEventsUI();
      renderApp();
    });

    onValue(ref(db, `rooms/${roomId}/items`), (snapshot) => {
      rawDataCache = snapshot.val() || {};
      renderApp();
      updateQuickNotes();
    });

    window.updateUserRole = function() {
      currentUserRole = document.getElementById('my-role').value;
      localStorage.setItem(`room_${roomId}_role`, currentUserRole);
      renderApp();
    };

    function updateNamesUI() {
      document.getElementById('name-a-input').value = currentSettings.nameA;
      document.getElementById('name-b-input').value = currentSettings.nameB;

      const payerSelect = document.getElementById('payer');
      payerSelect.options[0].text = currentSettings.nameA;
      payerSelect.options[1].text = currentSettings.nameB;

      const roleSelect = document.getElementById('my-role');
      roleSelect.options[0].text = currentSettings.nameA;
      roleSelect.options[1].text = currentSettings.nameB;
      roleSelect.value = currentUserRole;

      renderApp();
    }

    function updateEventsUI() {
      const eventSelect = document.getElementById('event-filter');
      const selectedVal = currentSettings.currentEvent;
      
      eventSelect.innerHTML = `
        <option value="all">すべてのイベント/テーマ</option>
        <option value="unsettled">未清算の項目のみ</option>
        <option value="settled">清算済の項目のみ</option>
      `;
      
      Object.entries(eventsList).forEach(([key, name]) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = name;
        eventSelect.appendChild(opt);
      });

      eventSelect.value = selectedVal || 'all';
    }

    function updateQuickNotes() {
      const noteCounts = {};
      Object.values(rawDataCache).forEach(item => {
        const note = (item.note || '').trim();
        if (note && note !== 'メモなし' && !item.isSettlement) {
          noteCounts[note] = (noteCounts[note] || 0) + 1;
        }
      });

      const sortedNotes = Object.keys(noteCounts)
        .sort((a, b) => noteCounts[b] - noteCounts[a])
        .slice(0, 5);

      const quickNotesContainer = document.getElementById('quick-notes');
      quickNotesContainer.innerHTML = '';

      sortedNotes.forEach(note => {
        const btn = document.createElement('button');
        btn.className = 'note-btn';
        btn.type = 'button';
        btn.textContent = note;
        btn.onclick = () => { document.getElementById('note').value = note; };
        quickNotesContainer.appendChild(btn);
      });
    }

    function isMatchPeriod(itemDate, selectedPeriod) {
      if (selectedPeriod === 'all') return true;
      if (selectedPeriod.length === 4) {
        return itemDate.substring(0, 4) === selectedPeriod;
      } else {
        return itemDate.substring(0, 7) === selectedPeriod;
      }
    }

    function isMatchEvent(item, selectedEvent) {
      if (selectedEvent === 'all') return true;
      if (selectedEvent === 'unsettled') return !item.isSettlement;
      if (selectedEvent === 'settled') return !!item.isSettlement;
      
      const itemEvent = item.eventId || 'default';
      return itemEvent === selectedEvent;
    }

    function renderApp() {
      const selectedPeriod = document.getElementById('month-filter').value;
      const selectedEvent = document.getElementById('event-filter').value;

      let totalA = 0;
      let totalB = 0;
      const historyList = document.getElementById('history');
      const approvalBox = document.getElementById('approval-requests-box');
      
      historyList.innerHTML = '';
      approvalBox.innerHTML = '';
      let pendingCount = 0;

      const entries = Object.entries(rawDataCache).reverse();

      entries.forEach(([id, item]) => {
        const payerName = item.payer === 'A' ? currentSettings.nameA : currentSettings.nameB;

        if (item.deleteRequested) {
          const requestedByName = item.deleteRequestedBy === 'A' ? currentSettings.nameA : currentSettings.nameB;
          const isMyRequest = item.deleteRequestedBy === currentUserRole;

          if (!isMyRequest) {
            pendingCount++;
            const approvalDiv = document.createElement('div');
            approvalDiv.className = 'approval-item';
            approvalDiv.innerHTML = `
              <div><strong>${requestedByName}</strong>が削除を申請中:</div>
              <div>${item.date} ${payerName} ¥${item.amount.toLocaleString()} (${item.note})</div>
              <div class="approval-btns">
                <button class="btn-approve" onclick="approveDelete('${id}')">許可して削除</button>
                <button class="btn-reject" onclick="rejectDelete('${id}')">拒否</button>
              </div>
            `;
            approvalBox.appendChild(approvalDiv);
          }
        }

        if (isMatchEvent(item, selectedEvent)) {
          if (isMatchPeriod(item.date || '', selectedPeriod)) {
            if (!item.deleteRequested) {
              if (item.payer === 'A') totalA += item.amount;
              if (item.payer === 'B') totalB += item.amount;
            }

            const isMyRequest = item.deleteRequestedBy === currentUserRole;

            const li = document.createElement('li');
            li.innerHTML = `
              <div class="item-header">
                <span>📅 ${item.date || '日付未設定'} ${item.isSettlement ? '<span class="settled-badge">🧹 清算済</span>' : ''}</span>
                <span><strong>${payerName}</strong></span>
              </div>
              <div class="item-body">
                <span>¥${item.amount.toLocaleString()} (${item.note})</span>
                ${item.deleteRequested 
                  ? (isMyRequest 
                      ? `<div style="display:flex; align-items:center; gap:6px;"><span class="pending-badge">相手の承認待ち ⏳</span><button class="btn-delete" style="background:#6c757d;" onclick="rejectDelete('${id}')">取消</button></div>` 
                      : `<span class="pending-badge">削除許可待ち</span>`)
                  : `<button class="btn-delete" onclick="requestDelete('${id}')">削除 🗑️</button>`
                }
              </div>
            `;
            historyList.appendChild(li);
          }
        }
      });

      const approvalContainer = document.getElementById('approval-container');
      approvalContainer.style.display = pendingCount > 0 ? 'block' : 'none';

      updatePeriodOptions(entries, selectedEvent, selectedPeriod);

      const nameA = currentSettings.nameA;
      const nameB = currentSettings.nameB;
      const filteredTotal = totalA + totalB;

      document.getElementById('filter-summary-box').innerHTML = `
        <div><span>${nameA}の支払額:</span><span>¥${totalA.toLocaleString()}</span></div>
        <div><span>${nameB}の支払額:</span><span>¥${totalB.toLocaleString()}</span></div>
        <div><span>絞り込み合計:</span><span>¥${filteredTotal.toLocaleString()}</span></div>
      `;

      const diff = totalA - totalB;
      const settlementEl = document.getElementById('settlement');
      const btnSettle = document.getElementById('btn-settle');

      if (diff === 0) {
        settlementEl.innerText = "貸し借りは現在ありません 👏";
        btnSettle.style.display = 'none';
        currentSettlementData = null;
      } else {
        const settleAmount = Math.abs(diff) / 2;
        const totalAmountToLog = Math.abs(diff);
        let payer, payerName, receiverName;

        if (diff > 0) {
          payer = 'B';
          payerName = nameB;
          receiverName = nameA;
        } else {
          payer = 'A';
          payerName = nameA;
          receiverName = nameB;
        }

        settlementEl.innerText = `${payerName} → ${receiverName} へ ¥${settleAmount.toLocaleString()} 支払う`;
        
        btnSettle.style.display = 'block';
        btnSettle.innerText = `🧹 ${payerName} が清算 (¥${settleAmount.toLocaleString()}) を記録する`;
        currentSettlementData = {
          payer: payer,
          totalAmount: totalAmountToLog,
          displayAmount: settleAmount,
          payerName: payerName
        };
      }
    }

    function updatePeriodOptions(entries, selectedEvent, currentSelected) {
      const filterSelect = document.getElementById('month-filter');
      const years = new Set();
      const months = new Set();

      entries.forEach(([id, item]) => {
        if (isMatchEvent(item, selectedEvent) && item.date && item.date.length >= 7) {
          years.add(item.date.substring(0, 4));
          months.add(item.date.substring(0, 7));
        }
      });

      filterSelect.innerHTML = '<option value="all">すべての期間</option>';
      
      Array.from(years).sort().reverse().forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = `${y}年（年間すべて）`;
        if (y === currentSelected) opt.selected = true;
        filterSelect.appendChild(opt);
      });

      Array.from(months).sort().reverse().forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m.replace('-', '年') + '月';
        if (m === currentSelected) opt.selected = true;
        filterSelect.appendChild(opt);
      });

      if (currentSelected === 'all') filterSelect.value = 'all';
    }

    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');

      if (tabName !== 'input') stopCamera();
    };

    window.addEvent = function() {
      const nameInput = document.getElementById('new-event-name');
      const eventName = nameInput.value.trim();
      if (!eventName) return alert('イベント名を入力してください');

      const eventId = 'event_' + Date.now();
      eventsList[eventId] = eventName;
      set(ref(db, `rooms/${roomId}/events`), eventsList);

      currentSettings.currentEvent = eventId;
      set(ref(db, `rooms/${roomId}/settings`), currentSettings);

      nameInput.value = '';
    };

    window.saveNames = function() {
      const nameA = document.getElementById('name-a-input').value.trim() || 'Aさん';
      const nameB = document.getElementById('name-b-input').value.trim() || 'Bさん';
      const apiKey = document.getElementById('gemini-key-input').value.trim();

      currentSettings.nameA = nameA;
      currentSettings.nameB = nameB;
      currentSettings.geminiApiKey = apiKey;

      set(ref(db, `rooms/${roomId}/settings`), currentSettings);
      alert('設定を保存しました！');
    };

    window.addEntry = function() {
      const payer = document.getElementById('payer').value;
      const amount = Number(document.getElementById('amount').value);
      const note = document.getElementById('note').value || 'メモなし';
      const date = document.getElementById('date').value;
      
      let eventId = document.getElementById('event-filter').value;
      if (eventId === 'all' || eventId === 'unsettled' || eventId === 'settled') eventId = 'default';

      const autoSwitch = document.getElementById('auto-switch-tab').checked;

      if (!amount) return alert('金額を入力してください');

      push(ref(db, `rooms/${roomId}/items`), {
        payer: payer,
        amount: amount,
        note: note,
        date: date,
        eventId: eventId,
        timestamp: Date.now(),
        deleteRequested: false,
        isSettlement: false
      });

      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      document.getElementById('date').value = today;
      document.getElementById('receipt-file').value = '';
      document.getElementById('ai-status').style.display = 'none';
      stopCamera();
      
      if (autoSwitch) {
        switchTab('history');
      } else {
        alert('追加しました！');
      }
    };

    // --- カメラ直接起動機能 ---
    window.openLiveCamera = async function() {
      if (!currentSettings.geminiApiKey) {
        alert('レシート自動入力を使用するには、設定タブでGemini APIキーを設定してください。');
        return;
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        }).catch(() => {
          return navigator.mediaDevices.getUserMedia({ video: true });
        });

        const video = document.getElementById('camera-video');
        video.srcObject = cameraStream;
        document.getElementById('camera-preview-container').style.display = 'block';
      } catch (err) {
        alert('カメラの起動に失敗しました。アクセス許可を確認してください。');
      }
    };

    window.stopCamera = function() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      document.getElementById('camera-preview-container').style.display = 'none';
    };

    window.captureAndAnalyze = function() {
      const video = document.getElementById('camera-video');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg').split(',')[1];
      stopCamera();
      sendToGeminiAPI(base64Data, 'image/jpeg');
    };

    // --- ファイル選択時 ---
    window.processFileAI = async function() {
      const fileInput = document.getElementById('receipt-file');
      const file = fileInput.files[0];
      if (!file) return;

      if (!currentSettings.geminiApiKey) {
        alert('レシート自動入力を使用するには、設定タブでGemini APIキーを設定してください。');
        fileInput.value = '';
        return;
      }

      const base64Data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });

      sendToGeminiAPI(base64Data, file.type);
    };

    // --- Gemini API 共通送信処理 ---
    async function sendToGeminiAPI(base64Data, mimeType) {
      const apiKey = currentSettings.geminiApiKey;
      const statusEl = document.getElementById('ai-status');

      statusEl.style.display = 'block';
      statusEl.innerText = '🤖 AIがレシートを解析中...';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "このレシート画像から「合計金額（数値のみ）」「日付（YYYY-MM-DD形式）」「店舗名または主な品目（10文字以内の短いメモ）」を抽出し、以下のJSONフォーマットのみで返してください。不明な場合は日付は今日、店舗名は『買い物』にしてください。例: {\"amount\": 1200, \"date\": \"2026-05-20\", \"note\": \"イオン\"}" },
                { inline_data: { mime_type: mimeType, data: base64Data } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const resData = await response.json();
        const textResult = resData.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(textResult);

        if (parsed.amount) document.getElementById('amount').value = parsed.amount;
        if (parsed.date) document.getElementById('date').value = parsed.date;
        if (parsed.note) document.getElementById('note').value = parsed.note;

        statusEl.innerText = '✅ 自動入力完了！上の項目を確認してください。';
      } catch (err) {
        console.error("AI Analysis Error:", err);
        statusEl.innerText = '❌ 解析に失敗しました。手動で入力してください。';
      }
    }

    window.executeSettlement = function() {
      if (!currentSettlementData) return;
      
      const { payer, totalAmount, displayAmount, payerName } = currentSettlementData;
      
      if (confirm(`${payerName}さんが ¥${displayAmount.toLocaleString()} を支払い、貸し借りを清算（リセット）します。よろしいですか？`)) {
        
        let eventId = document.getElementById('event-filter').value;
        if (eventId === 'all' || eventId === 'unsettled' || eventId === 'settled') eventId = 'default';

        push(ref(db, `rooms/${roomId}/items`), {
          payer: payer,
          amount: totalAmount,
          note: `清算（¥${displayAmount.toLocaleString()} 支払い）`,
          date: today,
          eventId: eventId,
          timestamp: Date.now(),
          deleteRequested: false,
          isSettlement: true
        });

        alert('清算を記録しました！');
      }
    };

    window.requestDelete = function(itemId) {
      if (confirm('相手に削除申請を送りますか？（相手が許可すると完全に削除されます）')) {
        update(ref(db, `rooms/${roomId}/items/${itemId}`), {
          deleteRequested: true,
          deleteRequestedBy: currentUserRole
        });
      }
    };

    window.approveDelete = function(itemId) {
      remove(ref(db, `rooms/${roomId}/items/${itemId}`));
    };

    window.rejectDelete = function(itemId) {
      update(ref(db, `rooms/${roomId}/items/${itemId}`), {
        deleteRequested: false,
        deleteRequestedBy: null
      });
    };

    window.onFilterChange = function() {
      currentSettings.currentEvent = document.getElementById('event-filter').value;
      set(ref(db, `rooms/${roomId}/settings`), currentSettings);
      renderApp();
    };

    window.copyShareUrl = function() {
      const copyText = document.getElementById('share-url');
      navigator.clipboard.writeText(copyText.value);
      alert('共有用URLをコピーしました！LINEなどで相手に送信してください。');
    };
  </script>
</head>
<body>

  <h2>💰 ふたりの貸し借りメモ</h2>

  <!-- 操作者の立場設定 -->
  <div class="my-role-select">
    <span>操作者（あなた）: </span>
    <select id="my-role" onchange="updateUserRole()" style="width: auto; padding: 4px 8px; margin-top: 0; display: inline-block;">
      <option value="A">Aさん</option>
      <option value="B">Bさん</option>
    </select>
  </div>

  <div class="card">
    <div id="settlement" class="result">読み込み中...</div>
    <button id="btn-settle" class="btn-settle" onclick="executeSettlement()"></button>
  </div>

  <div class="tab-menu">
    <button id="tab-btn-input" class="tab-btn active" onclick="switchTab('input')">✍️ 入力</button>
    <button id="tab-btn-history" class="tab-btn" onclick="switchTab('history')">📜 履歴</button>
    <button id="tab-btn-settings" class="tab-btn" onclick="switchTab('settings')">⚙️ 設定</button>
  </div>

  <div id="tab-input" class="tab-content active">
    <div class="card">
      <h3>立て替えを入力</h3>

      <label>日付</label>
      <input type="date" id="date">

      <label>払った人</label>
      <select id="payer">
        <option value="A">Aさん</option>
        <option value="B">Bさん</option>
      </select>

      <label>金額（円）</label>
      <input type="number" id="amount" placeholder="例: 1500" inputmode="numeric">

      <label>内容・メモ</label>
      <input type="text" id="note" placeholder="例: スーパーで買い物">
      <div class="quick-notes" id="quick-notes"></div>

      <label class="checkbox-label">
        <input type="checkbox" id="auto-switch-tab" checked>
        追加後に自動で「履歴」タブに移動する
      </label>

      <button onclick="addEntry()">追加する</button>

      <!-- AIレシート解析領域 -->
      <div class="ai-box">
        <label>🧾 レシートから自動入力</label>

        <input type="file" id="receipt-file" accept="image/*" onchange="processFileAI()" style="display:none;">
        
        <div class="ai-btn-group">
          <button type="button" onclick="openLiveCamera()">📷 カメラで撮影</button>
          <button type="button" onclick="document.getElementById('receipt-file').click()">📁 画像を選択</button>
        </div>

        <!-- カメラ撮影用画面 -->
        <div id="camera-preview-container">
          <video id="camera-video" autoplay playsinline></video>
          <div class="cam-action-btns">
            <button type="button" onclick="captureAndAnalyze()" style="background:#28a745;">📸 撮影して読み込む</button>
            <button type="button" onclick="stopCamera()" style="background:#6c757d;">閉じる</button>
          </div>
        </div>

        <div id="ai-status" class="loading-status"></div>
      </div>
    </div>
  </div>

  <div id="tab-history" class="tab-content">
    <div id="approval-container" class="card approval-card" style="display: none;">
      <h4>⚠️ 削除の承認リクエスト</h4>
      <div id="approval-requests-box"></div>
    </div>

    <div class="card">
      <h3>履歴・絞り込み</h3>
      
      <div class="filter-group">
        <label for="event-filter">表示中のイベント/テーマ</label>
        <select id="event-filter" onchange="onFilterChange()">
          <option value="all">すべてのイベント/テーマ</option>
          <option value="unsettled">未清算の項目のみ</option>
          <option value="settled">清算済の項目のみ</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="month-filter">表示する期間（年・月）</label>
        <select id="month-filter" onchange="onFilterChange()">
          <option value="all">すべての期間</option>
        </select>
      </div>

      <div class="filter-summary" id="filter-summary-box"></div>

      <ul id="history"></ul>
    </div>
  </div>

  <div id="tab-settings" class="tab-content">
    <div class="card">
      <h3>⚙️ イベント作成・設定</h3>

      <label>新しいイベントを作る（旅行など）</label>
      <div class="flex-inputs">
        <input type="text" id="new-event-name" placeholder="例: 沖縄旅行">
        <button onclick="addEvent()" style="width: auto; margin-top:6px; white-space:nowrap;">作成</button>
      </div>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

      <label>名前の変更</label>
      <div class="flex-inputs">
        <div>
          <span style="font-size:0.8em; color:#666;">Aさんの名前</span>
          <input type="text" id="name-a-input" value="Aさん">
        </div>
        <div>
          <span style="font-size:0.8em; color:#666;">Bさんの名前</span>
          <input type="text" id="name-b-input" value="Bさん">
        </div>
      </div>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

      <label>🤖 Gemini APIキー（レシート自動入力用）</label>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy...">
      <p style="font-size: 0.75em; color: #666; margin-top: 4px;">
        Google AI Studio等で取得した無料のGemini APIキーを入力して保存すると、レシート写真の読み込みが有効化されます。
      </p>

      <button onclick="saveNames()" style="background:#28a745;">設定を保存</button>

      <!-- システム更新日時 -->
      <div class="version-info">
        ⚙️ システム情報 (最終更新: 2026-08-23 23:32)
      </div>
    </div>

    <div class="card">
      <div class="room-info">
        部屋コード: <strong id="room-id">--</strong>
      </div>
      <input type="text" id="share-url" readonly style="font-size:0.8em; color:#666;">
      <button onclick="copyShareUrl()" style="background:#17a2b8;">相手に送るURLをコピー</button>
    </div>
  </div>

</body>
</html>
