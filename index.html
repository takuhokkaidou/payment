<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたりの貸し借りメモ（イベントプルダウン管理対応・JSON通信版）</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 16px; background: #f4f6f8; color: #333; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9em; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 12px; }
    button:hover { background: #0056b3; }
    .result { font-size: 1.2em; font-weight: bold; color: #28a745; text-align: center; padding: 10px 0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 12px 10px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 4px; }
    .item-header { display: flex; justify-content: space-between; font-size: 0.85em; color: #666; align-items: center; }
    .item-body { font-size: 1em; display: flex; justify-content: space-between; align-items: center; }
    .room-info { background: #e9ecef; padding: 8px; border-radius: 6px; font-size: 0.85em; text-align: center; word-break: break-all; margin-bottom: 12px; }
    .filter-group { margin-bottom: 12px; }
    .flex-inputs { display: flex; gap: 8px; }
    .flex-inputs > div { flex: 1; }
    
    .quick-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .note-btn { width: auto; padding: 6px 12px; font-size: 0.85em; background: #e9ecef; color: #495057; border: 1px solid #ced4da; margin-top: 0; border-radius: 16px; }
    
    .tab-menu { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 16px; background: #fff; border-radius: 8px 8px 0 0; overflow: hidden; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #f1f3f5; color: #495057; font-weight: bold; cursor: pointer; border-radius: 0; margin-top: 0; }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .filter-summary { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9em; }
    .filter-summary div { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .filter-summary div:last-child { margin-bottom: 0; font-weight: bold; border-top: 1px dashed #74c0fc; padding-top: 4px; }

    .btn-delete { width: auto; padding: 4px 8px; font-size: 0.8em; background: #dc3545; color: white; border: none; border-radius: 4px; margin-top: 0; }
    .btn-delete:hover { background: #bd2130; }
    .pending-badge { font-size: 0.8em; color: #e67e22; background: #fef5e7; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .settled-badge { font-size: 0.8em; color: #28a745; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
    
    .approval-card { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .approval-card h4 { margin: 0 0 8px 0; color: #856404; font-size: 0.95em; }
    .approval-item { font-size: 0.85em; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #ffe8a1; }
    .approval-btns { display: flex; gap: 8px; }
    .approval-btns button { padding: 6px; font-size: 0.8em; margin-top: 4px; }
    .btn-approve { background: #28a745; }
    .btn-reject { background: #6c757d; }

    .checkbox-label { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: normal; font-size: 0.85em; cursor: pointer; }
    .checkbox-label input { width: auto; margin-top: 0; }
    .my-role-select { background: #e2e3e5; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85em; }

    .btn-settle { background: #28a745; color: white; margin-top: 16px; padding: 10px; font-size: 0.95em; border-radius: 8px; display: none; }
    .btn-settle:hover { background: #218838; }

    .receipt-box { background: #f0f9ff; border: 1px dashed #7dd3fc; padding: 12px; border-radius: 8px; margin-top: 14px; }
    .receipt-help { color: #555; font-size: 0.82em; line-height: 1.5; }
    .receipt-link { display: inline-block; margin-top: 6px; color: #075985; font-weight: bold; }
    .receipt-upload-btn { background: #17a2b8; font-size: 0.8em; padding: 4px 8px; width: auto; margin-top: 4px; display: inline-block; }

    .event-manage-box { background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 6px; }

    .version-info { text-align: center; font-size: 0.8em; color: #6c757d; margin-top: 16px; padding-top: 8px; border-top: 1px dashed #ced4da; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmI46_HJP4T8gAx4upeCcF2eDNTXX-G6Q",
      authDomain: "payment-30c94.firebaseapp.com",
      databaseURL: "https://payment-30c94-default-rtdb.firebaseio.com",
      projectId: "payment-30c94",
      storageBucket: "payment-30c94.firebasestorage.app",
      messagingSenderId: "577725674845",
      appId: "1:577725674845:web:683b4d28b97ff3817aa4b4",
      measurementId: "G-H98HFNV6TX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 8);
      window.history.replaceState(null, null, `?room=${roomId}`);
    }

    document.getElementById('room-id').innerText = roomId;
    document.getElementById('share-url').value = window.location.href;
    document.getElementById('receipt-pin-input').value = localStorage.getItem(`room_${roomId}_receipt_pin`) || '';

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;

    let rawDataCache = {};
    let currentSettings = { nameA: "Aさん", nameB: "Bさん", currentEvent: "all", driveUploadUrl: "" };
    let eventsList = { "default": "日常の貸し借り" };
    let currentUserRole = localStorage.getItem(`room_${roomId}_role`) || 'A';
    let currentSettlementData = null;

    onValue(ref(db, `rooms/${roomId}/settings`), (snapshot) => {
      const data = snapshot.val();
      if (data) currentSettings = { ...currentSettings, ...data };
      updateNamesUI();
      document.getElementById('drive-upload-url').value = currentSettings.driveUploadUrl || '';
    });

    onValue(ref(db, `rooms/${roomId}/events`), (snapshot) => {
      const data = snapshot.val();
      if (data) eventsList = data;
      updateEventsUI();
      renderApp();
    });

    onValue(ref(db, `rooms/${roomId}/items`), (snapshot) => {
      rawDataCache = snapshot.val() || {};
      renderApp();
      updateQuickNotes();
    });

    window.updateUserRole = function() {
      currentUserRole = document.getElementById('my-role').value;
      localStorage.setItem(`room_${roomId}_role`, currentUserRole);
      renderApp();
    };

    function updateNamesUI() {
      document.getElementById('name-a-input').value = currentSettings.nameA;
      document.getElementById('name-b-input').value = currentSettings.nameB;

      const payerSelect = document.getElementById('payer');
      payerSelect.options[0].text = currentSettings.nameA;
      payerSelect.options[1].text = currentSettings.nameB;

      const roleSelect = document.getElementById('my-role');
      roleSelect.options[0].text = currentSettings.nameA;
      roleSelect.options[1].text = currentSettings.nameB;
      roleSelect.value = currentUserRole;

      renderApp();
    }

    function updateEventsUI() {
      const eventFilter = document.getElementById('event-filter');
      const selectedVal = currentSettings.currentEvent;
      
      eventFilter.innerHTML = `
        <option value="all">すべてのイベント/テーマ</option>
        <option value="unsettled">未清算の項目のみ</option>
        <option value="settled">清算済の項目のみ</option>
        <option disabled>------------------------</option>
      `;

      const entryEventSelect = document.getElementById('entry-event');
      entryEventSelect.innerHTML = '';

      const manageSelect = document.getElementById('manage-event-select');
      manageSelect.innerHTML = '';

      let hasCustomEvents = false;
      const customEventsHtml = [];

      Object.entries(eventsList).forEach(([key, name]) => {
        // 入力用
        const opt2 = document.createElement('option');
        opt2.value = key;
        opt2.textContent = name;
        entryEventSelect.appendChild(opt2);

        // 管理プルダウン用
        const optManage = document.createElement('option');
        optManage.value = key;
        optManage.textContent = name;
        manageSelect.appendChild(optManage);

        if (key === 'default') {
          const opt1 = document.createElement('option');
          opt1.value = key;
          opt1.textContent = name;
          eventFilter.appendChild(opt1);
        } else {
          hasCustomEvents = true;
          const opt1 = document.createElement('option');
          opt1.value = key;
          opt1.textContent = name;
          customEventsHtml.push(opt1);
        }
      });

      if (hasCustomEvents) {
        const divider = document.createElement('option');
        divider.disabled = true;
        divider.textContent = '--- 自作イベント ---';
        eventFilter.appendChild(divider);
        customEventsHtml.forEach(opt => eventFilter.appendChild(opt));
      }

      eventFilter.value = selectedVal || 'all';
      if (selectedVal && selectedVal !== 'all' && selectedVal !== 'unsettled' && selectedVal !== 'settled') {
        entryEventSelect.value = selectedVal;
      }

      // 管理セレクトボックスが変更されたときに下の入力欄を連動させる
      onManageEventChange();
    }

    // 管理プルダウンで選択されたイベント名をテキストボックスに反映
    window.onManageEventChange = function() {
      const select = document.getElementById('manage-event-select');
      const selectedKey = select.value;
      const nameInput = document.getElementById('manage-event-name-input');
      const deleteBtn = document.getElementById('btn-delete-event');

      if (selectedKey && eventsList[selectedKey]) {
        nameInput.value = eventsList[selectedKey];
        // デフォルト（日常の貸し借り）は削除ボタンを非表示にする
        if (selectedKey === 'default') {
          deleteBtn.style.display = 'none';
        } else {
          deleteBtn.style.display = 'inline-block';
        }
      }
    };

    function updateQuickNotes() {
      const noteCounts = {};
      Object.values(rawDataCache).forEach(item => {
        const note = (item.purchasePlace || item.note || '').trim();
        if (note && note !== 'メモなし' && note !== '場所未入力' && !item.isSettlement) {
          noteCounts[note] = (noteCounts[note] || 0) + 1;
        }
      });

      const sortedNotes = Object.keys(noteCounts)
        .sort((a, b) => noteCounts[b] - noteCounts[a])
        .slice(0, 5);

      const quickNotesContainer = document.getElementById('quick-notes');
      quickNotesContainer.innerHTML = '';

      sortedNotes.forEach(note => {
        const btn = document.createElement('button');
        btn.className = 'note-btn';
        btn.type =
